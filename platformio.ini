; Wiener Netze Smart Meter -> Shelly EM
;
; Reads + decrypts the meter and exposes it as a Shelly EM (HTTP + CoIoT, for
; Home Assistant) and/or MQTT, with telnet + serial logging and OTA. Each output
; is toggled in include/config.h.
;
; Wiring / debug / feature notes: see README.md.

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

; The IR head sits on UART0 *after* Serial.swap() (GPIO15 TX / GPIO13 RX).
; Logs go out UART1 (Serial1 / GPIO2). Bridge GPIO2 (D4) -> GPIO1 (TX) to read
; them over USB at this baud.
monitor_speed = 115200

; First flash over USB:
upload_protocol = esptool
; --- After the first USB flash you can upload wirelessly (OTA). Comment the line
;     above and uncomment these (set host/IP, and --auth only if OTA_PASSWORD set):
; upload_protocol = espota
; upload_port = smartmeter2shelly.local   ; or device IP, e.g. 192.168.1.50
; upload_flags = --auth=YOUR_OTA_PASSWORD

lib_deps =
    frankboesing/FastCRC@^1.41      ; CRC16/X25 frame check
    rweather/Crypto@^0.4.0          ; AES-128-CTR decrypt (ESP8266)
    knolleary/PubSubClient@^2.8     ; MQTT publish (feature-toggled in include/config.h)

build_flags =
    ; Meter brand framing constants (see lib/SmartMeter/SmartMeter.h).
    ; Default (no flag) = Landis+Gyr E450 / Iskraemeco AM550.
    -D METER_BRAND_LANDIS_GYR=1
    ; -D METER_BRAND_SIEMENS=1
